<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Creator</title>
    <link href = "images/Pi-Transparent.png" rel="icon" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./flashcards.css">
</head>
<body>
<div class="window">

    <!-- Top Bar -->
    <div class="title-bar">
        <span>Pi&AI</span>
        <div style="display:flex; align-items:center; gap:10px;">
            <a href="firstPage.html" class="nav-link">Home</a>
            <a href="chatInterface.html" class="nav-link">Chat</a>
            <a href="secondPage.html" class="nav-link">Study Tools</a>
        </div>
    </div>

    <div class="container">

        <div class="main-content">
            <div class="flashcard-form">
                <h2>Create New Flashcard</h2>

                <div class="ai-generate-section">
                    <h3><i class="fas fa-robot"></i> Generate with Pi</h3>
                    <div class="form-group">
                        <label for="aiTopic">Tech Topic</label>
                        <input type="text" id="aiTopic" class="form-control" placeholder="e.g., binary search, TCP/IP, React hooks...">
                    </div>
                    <div class="form-group">
                        <label for="aiCount">Number of Cards</label>
                        <select id="aiCount" class="form-control">
                            <option value="3">3</option>
                            <option value="5" selected>5</option>
                            <option value="10">10</option>
                        </select>
                    </div>
                    <button id="generateWithAIBtn" class="btn btn-primary">
                        <i class="fas fa-magic"></i> Generate with Pi
                    </button>
                    <div id="aiLoading" style="display:none; margin-top: 0.5rem; color: var(--primary);">
                        <i class="fas fa-spinner fa-spin"></i> Generating flashcards...
                    </div>
                </div>

            </div>

            <div class="flashcards-section">
                <div class="actions-bar">
                    <div class="stats" id="statsDisplay">0 flashcards</div>
                    <button id="addCardBtn" class="btn btn-primary" style="padding: 0.5rem 1rem;">
                        <i class="fas fa-plus"></i> Add Card
                    </button>
                    <button id="studyAllBtn" class="btn btn-primary" style="padding: 0.5rem 1rem;">
                        <i class="fas fa-graduation-cap"></i> Study All
                    </button>
                    <button id="deleteAllBtn" class="btn btn-danger" style="padding: 0.5rem 1rem;">
                        <i class="fas fa-trash"></i> Delete All
                    </button>
                    <div class="import-export">
                        <div class = "tooltip">
                        <button id="importBtn" class="btn btn-outline" style="padding: 0.5rem;">
                            <i class="fas fa-file-import"></i>
                        </button>
                        
                        
                        <button id="exportBtn" class="btn btn-outline" style="padding: 0.5rem;">
                            <i class="fas fa-file-export"></i>
                        </button>
                        <span class="tooltiptext">Import and Export Flashcards</span>
                        </div>
                        <input type="file" id="importFile" style="display: none;" accept=".json">
                    </div>
                </div>

                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search flashcards...">
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>

                <div class="tag-filter" id="tagFilter">
                    <!-- Tags will be added here dynamically -->
                </div>

                <div class="flashcards-container" id="flashcardsContainer">
                    <div class="empty-state">
                        <i class="fas fa-layer-group"></i>
                        <h3>No Flashcards Yet</h3>
                        <p>Create your first flashcard to get started!</p>
                        <button class="btn btn-primary">
                            <i class="fas fa-plus"></i> Create Flashcard
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Study Mode Modal -->
    <div class="study-mode" id="studyMode">
        <div class="study-card" id="studyCard">
            <button class="close-study" id="closeStudy">
                <i class="fas fa-times"></i>
            </button>
            <div class="progress-indicator" id="progressIndicator">1/10</div>
            <div class="study-card-front">
                <h2 id="studyFrontTitle">Front Title</h2>
                <p id="studyFrontContent">Front content goes here...</p>
                <button class="btn btn-primary" id="flipStudyCardBtn">
                    <i class="fas fa-redo"></i> Flip Card
                </button>
            </div>
            <div class="study-card-back">
                <h2>Answer</h2>
                <p id="studyBackContent">Back content goes here...</p>
                <div class="study-nav">
                    <button class="btn btn-outline" id="prevCardBtn">
                        <i class="fas fa-arrow-left"></i> Previous
                    </button>
                    <div>
                        <button class="btn btn-primary" id="nextCardBtn">
                            Next <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="./flashcardscript.js"></script>
</body>

</html>
