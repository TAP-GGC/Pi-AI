    <!-- Speech Bubble --> 
    <p class="speech-bubble">Hello<br>everyone!</p>
    <style>
    .speech-bubble {
    text-align: center;
    text-transform: uppercase;
    font-weight: bold;
    letter-spacing: 3px;
    font-size: 15px;        /* smaller text */
    color: #774f38;
    background-color: #f4e8f6;

    padding: 20px;          /* reduced from 50px */
    border-radius: 12px;
    position: relative;
    font-family: cursive;

    max-width: 320px;       /* prevents full width */
    width: fit-content;     /* adjusts to text */
    margin: 40px auto;      /* centers it */

    box-shadow: 20px 20px #830396;

    animation: float 5s ease-in-out infinite;
    }

    /* Tail */
    .speech-bubble::after {
        content: "";
        position: absolute;
        bottom: -30px;
        left: 40px;

        width: 40px;
        height: 25px;
        background-color: #f4e8f6;
        border-radius: 10px;

        box-shadow: 20px 20px #830396;
    }   
    @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
    }
        
    </style>
    
    <img id="clock-ring" src="images/clock-ringing.png"
