<body>

<div class="window">

    <!-- Top Bar -->
    <div class="title-bar">
        <span>Pi&AI</span>
        <div class="window-buttons">
            <div class="btn">—</div>
            <div class="btn">☐</div>
            <div class="btn">✕</div>
        </div>
    </div>

    <!-- Timer -->
 <div class="container">
        <h1 class="title">Timer</h1>

        <hr>

        <p class="timer" id = "timer">25:00</p>

        <div class="button-wrapper">
            <button id="start">Start</button>
            <button id="stop">Stop</button>
            <button id="reset">Reset</button>
        </div>
    </div>

    <!-- Address + Search -->
    <header>
    <div class="toolbar">
        <div class="address">D:Folder</div>
        <input type="text" placeholder="Search">
    </div>
    </header>

    <!-- Side Bar -->
     <div>

    </div>

    

</div>
