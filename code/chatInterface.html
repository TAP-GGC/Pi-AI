<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi&AI</title>
    <link href="images/Pi-Transparent.png" rel="icon" type="image/x-icon">
    <style>
        :root {
            --primary: #dca0e8;
            --secondary: #f4e8f6;
            --tertiary: #e0b3e8;
            --quaternary: #c480d0;
            --correct: #9aecb3;
            --hint: #ffe599;
            --text: #2d0033;
            --bubble-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #efccf6;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            padding: 0;
            overflow-x: hidden;
            margin: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            background-color: #c0c0c0;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 3px solid black;
        }

        .chat-header {
            background: linear-gradient(to right, rgb(122, 0, 128), rgb(234, 0, 255));
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0;
            z-index: 10;
        }

        .chat-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }

        .chat-header a {
            color: white !important;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
        }

        .chat-header a:hover {
            background: rgba(255,255,255,0.3);
        }

        .progress-container {
            height: 6px;
            width: 100px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.2);
        }

        .progress-bar {
            height: 100%;
            width: 30%;
            background-color: white;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            background-color: #efccf6;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: var(--bubble-radius);
            line-height: 1.5;
            position: relative;
            font-size: 0.95rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
            border: 2px solid rgba(0,0,0,0.15);
        }

        .message.tutor {
            align-self: flex-start;
            background-color: var(--secondary);
            border-bottom-left-radius: 2px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
        }

        .message.tutor::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: -10px;
            width: 20px;
            height: 20px;
            background-color: var(--secondary);
            border-bottom-right-radius: 20px;
            z-index: -1;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--primary);
            border-bottom-right-radius: 2px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
        }

        .message.user::before {
            content: '';
            position: absolute;
            bottom: 0;
            right: -10px;
            width: 20px;
            height: 20px;
            background-color: var(--primary);
            border-bottom-left-radius: 20px;
            z-index: -1;
        }

        .option-message {
            background-color: var(--secondary);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 90%;
            align-self: flex-start;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
            border: 2px solid rgba(0,0,0,0.15);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.15);
        }

        .option-button {
            background-color: #c0c0c0;
            border: 2px solid black;
            border-radius: 4px;
            padding: 10px 15px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            position: relative;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .option-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .option-button:hover {
            transform: translateY(-3px);
            background-color: #d8d8d8;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        .option-button:hover::before {
            transform: translateX(100%);
        }

        .option-button:active {
            border-style: inset;
        }

        .option-button.correct {
            background-color: var(--correct);
            transform: scale(1.05);
            border-color: #2e7d32;
        }

        .option-button.incorrect {
            background-color: #ffcccb;
            opacity: 0.7;
            border-color: #c62828;
        }

        .message.hint {
            background-color: var(--hint);
            align-self: center;
            font-style: italic;
            max-width: 90%;
            font-size: 0.9rem;
            transform: rotate(-1deg);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
            border: 2px solid rgba(0,0,0,0.15);
        }

        .emoji {
            display: inline-block;
            transform: scale(1);
            transition: transform 0.3s ease;
            margin: 0 2px;
        }

        .emoji:hover {
            transform: scale(1.5);
            display: inline-block;
        }

        .chat-input {
            padding: 12px 20px;
            background-color: #c0c0c0;
            display: flex;
            align-items: center;
            border-top: 3px solid black;
            z-index: 10;
        }

        .message-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid black;
            border-radius: 4px;
            font-size: 0.95rem;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .message-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgb(196, 90, 236);
        }

        .send-button {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            background-color: rgb(196, 90, 236);
            border: 2px solid black;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .send-button:hover {
            transform: translateY(-3px);
            background-color: rgb(220, 120, 255);
        }

        .send-button:active {
            border-style: inset;
        }

        .send-button svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .continue-button {
            background-color: rgb(196, 90, 236);
            border: 2px solid black;
            border-radius: 4px;
            padding: 8px 18px;
            align-self: center;
            margin-top: 10px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            transition: all 0.2s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .continue-button:hover {
            transform: translateY(-3px);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        .continue-button:active {
            border-style: inset;
        }

        .feedback-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 5rem;
            z-index: 100;
            user-select: none;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
        }

        .feedback-animation.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: var(--secondary);
            border: 2px solid rgba(0,0,0,0.15);
            align-self: flex-start;
            margin-top: 5px;
            opacity: 0;
        }

        .typing-indicator.show {
            opacity: 1;
            animation: fadeIn 0.3s forwards;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgb(196, 90, 236);
            animation: typingAnimation 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnimation {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes sparkle {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.7;
            }
        }

        .sparkle {
            animation: sparkle 1s ease-in-out;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
            font-size: 16px;
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .floating-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background-color: rgba(200, 100, 220, 0.2);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                width: 100%;
            }

            .message {
                max-width: 85%;
                font-size: 0.9rem;
                padding: 12px 16px;
            }

            .chat-header h1 {
                font-size: 1rem;
            }
        }

        /* Custom scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 16px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #c0c0c0;
            border: 1px solid #808080;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #a0a0a0;
            border: 2px solid black;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #888;
        }

        /* Checkmark animation */
        .checkmark {
            width: 20px;
            height: 20px;
            position: relative;
            display: inline-block;
            transform: rotate(45deg);
            margin-left: 5px;
        }

        .checkmark-stem {
            position: absolute;
            width: 3px;
            height: 10px;
            background-color: white;
            left: 10px;
            top: 5px;
        }

        .checkmark-kick {
            position: absolute;
            width: 7px;
            height: 3px;
            background-color: white;
            left: 4px;
            top: 12px;
        }

        @keyframes grow-checkmark {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .grow-checkmark {
            animation: grow-checkmark 0.5s ease-in-out;
        }

        .message.interactive {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .message.interactive:hover {
            transform: scale(1.02);
        }

    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="user-info">
                <div class="avatar">Pi</div>
                <h1>Pi&AI - Tech Study Assistant</h1>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="firstPage.html">Home</a>
                <a href="secondPage.html">Study Tools</a>
                <a href="flashcardmaker.html">Flashcards</a>
                <button id="clearChatBtn" style="color:white;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);border-radius:4px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;">Clear Chat</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <!-- Messages will be added here by JavaScript -->
        </div>
        <div class="chat-input">
            <input type="text" class="message-input" id="messageInput" placeholder="Ask me anything — no question is too small!" aria-label="Message input">
            <button class="send-button" id="sendButton" aria-label="Send message">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
        <div class="floating-particles" id="particles"></div>
    </div>
    <div class="feedback-animation" id="feedbackAnimation"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const chatMessages = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const particlesContainer = document.getElementById('particles');

            const API_URL = 'http://127.0.0.1:5000/api/chat';
            let chatHistory = [];
            let displayHistory = [];
            let isSending = false;

            const CHAT_STORAGE_KEY = 'piAI_chatHistory';
            const DISPLAY_STORAGE_KEY = 'piAI_displayHistory';

            const EXAMPLE_QUESTIONS = [
                "What is the internet and how does it work?",
                "How do I start learning to code?",
                "What does an algorithm do?",
                "Help me understand passwords and staying safe online",
                "What is a computer program?",
                "What's the difference between a website and an app?",
                "What is artificial intelligence?",
                "How do apps on my phone actually work?",
                "What is a bug in coding?",
                "What does a software engineer do every day?",
                "What is the cloud and where does it store things?",
                "How does a search engine find answers so fast?",
                "What is cybersecurity and why does it matter?",
                "What is a database?",
                "How do video games get made?",
                "What is HTML and what is it used for?",
            ];

            function buildWelcomeMessage(questions) {
                const fallback = [...EXAMPLE_QUESTIONS].sort(() => Math.random() - 0.5).slice(0, 4);
                const picked = (questions && questions.length === 4) ? questions : fallback;
                const bullets = picked.map(q => `&bull; <em>&quot;${q}&quot;</em>`).join('<br>');
                return (
                    "Hey there! I'm <strong>Pi</strong> — your friendly tech helper! 👋<br><br>" +
                    "Whether you're just starting out or already know a thing or two, I'm here to make technology easy and fun. No question is too small — ever!<br><br>" +
                    "<strong>You can ask me things like:</strong><br>" + bullets + "<br><br>" +
                    "<strong>I can also make flashcards or a study plan for you!</strong> Try:<br>" +
                    "&bull; <em>&quot;make me flashcards on [topic]&quot;</em> — to build a quick study set<br>" +
                    "&bull; <em>&quot;make me a study plan for [topic]&quot;</em> — to get a step-by-step learning path<br><br>" +
                    "So, what would you like to learn today?"
                );
            }

            async function fetchWelcomeQuestions() {
                try {
                    const res = await fetch('http://127.0.0.1:5000/api/welcome-questions');
                    if (!res.ok) return null;
                    const data = await res.json();
                    return data.questions || null;
                } catch {
                    return null;
                }
            }

            function loadChatState() {
                try {
                    const savedChat = localStorage.getItem(CHAT_STORAGE_KEY);
                    const savedDisplay = localStorage.getItem(DISPLAY_STORAGE_KEY);
                    if (savedChat) chatHistory = JSON.parse(savedChat);
                    if (savedDisplay) {
                        const msgs = JSON.parse(savedDisplay);
                        if (msgs && msgs.length > 0) {
                            displayHistory = msgs;
                            msgs.forEach(msg => addMessage(msg.type, msg.content, true));
                            return true;
                        }
                    }
                } catch (e) {
                    console.error('Failed to load chat history:', e);
                }
                return false;
            }
            
            // Create particles for background effect
            function createParticles() {
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    particle.style.width = `${Math.random() * 15 + 5}px`;
                    particle.style.height = particle.style.width;
                    particle.style.left = `${Math.random() * 100}%`;
                    particle.style.top = `${Math.random() * 100}%`;
                    particle.style.opacity = Math.random() * 0.3 + 0.1;
                    const colors = ['rgba(200, 100, 220, 0.2)', 'rgba(234, 0, 255, 0.15)', 'rgba(180, 80, 200, 0.2)', 'rgba(244, 232, 246, 0.3)'];
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    particlesContainer.appendChild(particle);
                    animateParticle(particle);
                }
            }

            function animateParticle(particle) {
                const duration = Math.random() * 20000 + 10000;
                let startX = parseFloat(particle.style.left);
                let startY = parseFloat(particle.style.top);
                const destX = Math.random() * 100;
                const destY = Math.random() * 100;
                let startTime = null;

                function moveParticle(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const progress = (timestamp - startTime) / duration;
                    if (progress < 1) {
                        particle.style.left = `${startX + (destX - startX) * progress}%`;
                        particle.style.top = `${startY + (destY - startY) * progress}%`;
                        requestAnimationFrame(moveParticle);
                    } else {
                        animateParticle(particle);
                    }
                }
                requestAnimationFrame(moveParticle);
            }

            function showTypingIndicator() {
                const typingIndicator = document.createElement('div');
                typingIndicator.className = 'typing-indicator';
                typingIndicator.id = 'typingIndicator';
                for (let i = 0; i < 3; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'typing-dot';
                    typingIndicator.appendChild(dot);
                }
                chatMessages.appendChild(typingIndicator);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                setTimeout(() => typingIndicator.classList.add('show'), 100);
            }

            function hideTypingIndicator() {
                const indicator = document.getElementById('typingIndicator');
                if (indicator) indicator.remove();
            }

            function formatMarkdown(text) {
                return text
                    .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*([\s\S]+?)\*/g, '<em>$1</em>')
                    .replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,0.08);padding:1px 5px;border-radius:3px;font-family:monospace;">$1</code>')
                    .replace(/\n/g, '<br>');
            }

            function addMessage(type, content, isRestoring = false) {
                hideTypingIndicator();
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                if (isRestoring) {
                    messageDiv.style.animation = 'none';
                    messageDiv.style.opacity = '1';
                    messageDiv.style.transform = 'translateY(0)';
                }
                messageDiv.innerHTML = content;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                if (!isRestoring) {
                    displayHistory.push({ type, content });
                    localStorage.setItem(DISPLAY_STORAGE_KEY, JSON.stringify(displayHistory));
                }
            }

            function saveStudyPlanToStorage(topics) {
                const plan = topics.map(text => ({ text, done: false }));
                localStorage.setItem('piAI_studyPlan', JSON.stringify(plan));
            }

            function saveFlashcardsToStorage(cards) {
                const existing = JSON.parse(localStorage.getItem('flashcards')) || [];
                cards.forEach(card => {
                    existing.push({
                        id: Date.now().toString() + Math.random().toString(36).slice(2),
                        title: card.title,
                        front: card.front,
                        back: card.back,
                        tags: Array.isArray(card.tags) ? card.tags : [],
                        createdAt: new Date().toISOString()
                    });
                });
                localStorage.setItem('flashcards', JSON.stringify(existing));
            }

            function handleFlashcardDelete(message) {
                const lower = message.toLowerCase().trim();

                const hasDeleteIntent = /\b(delete|remove|clear|erase|wipe|get rid of|reset)\b/.test(lower);
                const hasFlashcardMention = /\b(flash\s*cards?|cards?)\b/.test(lower);

                if (!hasDeleteIntent || !hasFlashcardMention) return false;

                const flashcards = JSON.parse(localStorage.getItem('flashcards')) || [];

                // Try to extract a specific topic
                // Pattern 1: "...about/on/for/called/named/titled X"
                const prepMatch = lower.match(/\b(?:about|on|for|called|named|titled|related\s+to)\s+(.+?)(?:\s*[?!.]?\s*$)/);
                // Pattern 2: "delete [topic] flashcards"
                const beforeMatch = lower.match(/\b(?:delete|remove|clear|erase|wipe)\s+(?:my\s+|the\s+|all\s+(?:my\s+|the\s+)?)?(.+?)\s+(?:flash\s*cards?|cards?)\b/);

                let keyword = null;
                if (prepMatch) {
                    keyword = prepMatch[1].trim();
                } else if (beforeMatch) {
                    const candidate = beforeMatch[1].trim();
                    // Ignore filler words that don't indicate a topic
                    if (candidate && !/^(all|every|my|the|a|an|some|any)$/.test(candidate)) {
                        keyword = candidate;
                    }
                }

                if (keyword) {
                    const remaining = [];
                    const removed = [];
                    flashcards.forEach(card => {
                        const matchesTitle = card.title && card.title.toLowerCase().includes(keyword);
                        const matchesFront = card.front && card.front.toLowerCase().includes(keyword);
                        const matchesTags = card.tags && card.tags.some(t => t.toLowerCase().includes(keyword));
                        if (matchesTitle || matchesFront || matchesTags) {
                            removed.push(card);
                        } else {
                            remaining.push(card);
                        }
                    });

                    if (removed.length === 0) {
                        addMessage('tutor', `I couldn't find any flashcards matching "${keyword}". <a href="flashcardmaker.html" style="color: #9b30ff; text-decoration: underline;">View your flashcards</a> to see what you have.`);
                        return true;
                    }

                    localStorage.setItem('flashcards', JSON.stringify(remaining));
                    addMessage('tutor', `Done! Removed ${removed.length} flashcard${removed.length > 1 ? 's' : ''} matching "${keyword}". You have ${remaining.length} card${remaining.length !== 1 ? 's' : ''} remaining.`);
                    return true;
                }

                // No specific topic — delete all
                if (flashcards.length === 0) {
                    addMessage('tutor', "You don't have any flashcards to clear.");
                    return true;
                }
                const count = flashcards.length;
                localStorage.setItem('flashcards', JSON.stringify([]));
                addMessage('tutor', `Done! Cleared all ${count} flashcards from your collection.`);
                return true;
            }

            async function sendMessage() {
                const message = messageInput.value.trim();
                if (!message || isSending) return;

                isSending = true;
                sendButton.disabled = true;
                messageInput.value = '';

                addMessage('user', message);
                chatHistory.push({ role: 'user', content: message });
                localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(chatHistory));

                // Handle flashcard delete/clear commands locally
                if (handleFlashcardDelete(message)) {
                    isSending = false;
                    sendButton.disabled = false;
                    messageInput.focus();
                    return;
                }

                showTypingIndicator();

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: message, history: chatHistory })
                    });

                    const data = await response.json();

                    if (data.error) {
                        addMessage('tutor', 'Sorry, something went wrong. Please try again.');
                    } else if (data.flashcards && data.flashcards.length > 0) {
                        saveFlashcardsToStorage(data.flashcards);
                        const flashcardReply = `Done! ${data.flashcards.length} flashcards added to your collection.`;
                        addMessage('tutor', `${flashcardReply} <a href="flashcardmaker.html" style="color: #9b30ff; text-decoration: underline;">View your flashcards</a>`);
                        chatHistory.push({ role: 'assistant', content: flashcardReply });
                        localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(chatHistory));
                    } else if (data.study_plan && data.study_plan.length > 0) {
                        saveStudyPlanToStorage(data.study_plan);
                        const planReply = `Done! I've created a study plan with ${data.study_plan.length} topics.`;
                        addMessage('tutor', `${planReply} <a href="secondPage.html" style="color: #9b30ff; text-decoration: underline;">Go to Study Tools</a> to start!`);
                        chatHistory.push({ role: 'assistant', content: planReply });
                        localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(chatHistory));
                    } else {
                        addMessage('tutor', formatMarkdown(data.response));
                        chatHistory.push({ role: 'assistant', content: data.response });
                        localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(chatHistory));
                    }
                } catch (error) {
                    hideTypingIndicator();
                    addMessage('tutor', 'Could not connect to Pi. Make sure the backend server is running.');
                }

                isSending = false;
                sendButton.disabled = false;
                messageInput.focus();
            }

            // Clear chat button
            document.getElementById('clearChatBtn').addEventListener('click', async function() {
                chatHistory = [];
                displayHistory = [];
                localStorage.removeItem(CHAT_STORAGE_KEY);
                localStorage.removeItem(DISPLAY_STORAGE_KEY);
                chatMessages.innerHTML = '';
                const questions = await fetchWelcomeQuestions();
                addMessage('tutor', buildWelcomeMessage(questions));
            });

            // Send button click
            sendButton.addEventListener('click', sendMessage);

            // Enter key to send
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Restore history or show welcome message
            createParticles();
            const hasHistory = loadChatState();
            if (!hasHistory) {
                const questions = await fetchWelcomeQuestions();
                addMessage('tutor', buildWelcomeMessage(questions));
            }
        });
    </script>
</body>
</html>
