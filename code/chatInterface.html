<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi&AI</title>
    <link href="images/Pi-Transparent.png" rel="icon" type="image/x-icon">
    <style>
        :root {
            --primary: #dca0e8;
            --secondary: #f4e8f6;
            --tertiary: #e0b3e8;
            --quaternary: #c480d0;
            --correct: #9aecb3;
            --hint: #ffe599;
            --text: #2d0033;
            --bubble-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #efccf6;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            padding: 0;
            overflow-x: hidden;
            margin: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            background-color: #c0c0c0;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 3px solid black;
        }

        .chat-header {
            background: linear-gradient(to right, rgb(122, 0, 128), rgb(234, 0, 255));
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0;
            z-index: 10;
        }

        .chat-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }

        .chat-header a {
            color: white !important;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
        }

        .chat-header a:hover {
            background: rgba(255,255,255,0.3);
        }

        .progress-container {
            height: 6px;
            width: 100px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.2);
        }

        .progress-bar {
            height: 100%;
            width: 30%;
            background-color: white;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            background-color: #efccf6;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: var(--bubble-radius);
            line-height: 1.5;
            position: relative;
            font-size: 0.95rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
            border: 2px solid rgba(0,0,0,0.15);
        }

        .message.tutor {
            align-self: flex-start;
            background-color: var(--secondary);
            border-bottom-left-radius: 2px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
        }

        .message.tutor::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: -10px;
            width: 20px;
            height: 20px;
            background-color: var(--secondary);
            border-bottom-right-radius: 20px;
            z-index: -1;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--primary);
            border-bottom-right-radius: 2px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
        }

        .message.user::before {
            content: '';
            position: absolute;
            bottom: 0;
            right: -10px;
            width: 20px;
            height: 20px;
            background-color: var(--primary);
            border-bottom-left-radius: 20px;
            z-index: -1;
        }

        .option-message {
            background-color: var(--secondary);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 90%;
            align-self: flex-start;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
            border: 2px solid rgba(0,0,0,0.15);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.15);
        }

        .option-button {
            background-color: #c0c0c0;
            border: 2px solid black;
            border-radius: 4px;
            padding: 10px 15px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            position: relative;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .option-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .option-button:hover {
            transform: translateY(-3px);
            background-color: #d8d8d8;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        .option-button:hover::before {
            transform: translateX(100%);
        }

        .option-button:active {
            border-style: inset;
        }

        .option-button.correct {
            background-color: var(--correct);
            transform: scale(1.05);
            border-color: #2e7d32;
        }

        .option-button.incorrect {
            background-color: #ffcccb;
            opacity: 0.7;
            border-color: #c62828;
        }

        .message.hint {
            background-color: var(--hint);
            align-self: center;
            font-style: italic;
            max-width: 90%;
            font-size: 0.9rem;
            transform: rotate(-1deg);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
            border: 2px solid rgba(0,0,0,0.15);
        }

        .emoji {
            display: inline-block;
            transform: scale(1);
            transition: transform 0.3s ease;
            margin: 0 2px;
        }

        .emoji:hover {
            transform: scale(1.5);
            display: inline-block;
        }

        .chat-input {
            padding: 12px 20px;
            background-color: #c0c0c0;
            display: flex;
            align-items: center;
            border-top: 3px solid black;
            z-index: 10;
        }

        .message-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid black;
            border-radius: 4px;
            font-size: 0.95rem;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .message-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgb(196, 90, 236);
        }

        .send-button {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            background-color: rgb(196, 90, 236);
            border: 2px solid black;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .send-button:hover {
            transform: translateY(-3px);
            background-color: rgb(220, 120, 255);
        }

        .send-button:active {
            border-style: inset;
        }

        .send-button svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .continue-button {
            background-color: rgb(196, 90, 236);
            border: 2px solid black;
            border-radius: 4px;
            padding: 8px 18px;
            align-self: center;
            margin-top: 10px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            transition: all 0.2s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .continue-button:hover {
            transform: translateY(-3px);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        .continue-button:active {
            border-style: inset;
        }

        .feedback-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 5rem;
            z-index: 100;
            user-select: none;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
        }

        .feedback-animation.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: var(--secondary);
            border: 2px solid rgba(0,0,0,0.15);
            align-self: flex-start;
            margin-top: 5px;
            opacity: 0;
        }

        .typing-indicator.show {
            opacity: 1;
            animation: fadeIn 0.3s forwards;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgb(196, 90, 236);
            animation: typingAnimation 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnimation {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes sparkle {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.7;
            }
        }

        .sparkle {
            animation: sparkle 1s ease-in-out;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
            font-size: 16px;
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .floating-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background-color: rgba(200, 100, 220, 0.2);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                width: 100%;
            }

            .message {
                max-width: 85%;
                font-size: 0.9rem;
                padding: 12px 16px;
            }

            .chat-header h1 {
                font-size: 1rem;
            }
        }

        /* Custom scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 16px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #c0c0c0;
            border: 1px solid #808080;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #a0a0a0;
            border: 2px solid black;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #888;
        }

        /* Checkmark animation */
        .checkmark {
            width: 20px;
            height: 20px;
            position: relative;
            display: inline-block;
            transform: rotate(45deg);
            margin-left: 5px;
        }

        .checkmark-stem {
            position: absolute;
            width: 3px;
            height: 10px;
            background-color: white;
            left: 10px;
            top: 5px;
        }

        .checkmark-kick {
            position: absolute;
            width: 7px;
            height: 3px;
            background-color: white;
            left: 4px;
            top: 12px;
        }

        @keyframes grow-checkmark {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .grow-checkmark {
            animation: grow-checkmark 0.5s ease-in-out;
        }

        .message.interactive {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .message.interactive:hover {
            transform: scale(1.02);
        }

    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="user-info">
                <div class="avatar">Pi</div>
                <h1>Pi&AI - Math Study Assistant</h1>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="firstPage.html">Home</a>
                <a href="secondPage.html">Study Tools</a>
                <a href="flashcardmaker.html">Flashcards</a>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <!-- Messages will be added here by JavaScript -->
        </div>
        <div class="chat-input">
            <input type="text" class="message-input" id="messageInput" placeholder="Ask Pi a math question..." aria-label="Message input">
            <button class="send-button" id="sendButton" aria-label="Send message">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
        <div class="floating-particles" id="particles"></div>
    </div>
    <div class="feedback-animation" id="feedbackAnimation"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const particlesContainer = document.getElementById('particles');

            const API_URL = 'http://127.0.0.1:5000/api/chat';
            let chatHistory = [];
            let isSending = false;
            
            // Create particles for background effect
            function createParticles() {
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    particle.style.width = `${Math.random() * 15 + 5}px`;
                    particle.style.height = particle.style.width;
                    particle.style.left = `${Math.random() * 100}%`;
                    particle.style.top = `${Math.random() * 100}%`;
                    particle.style.opacity = Math.random() * 0.3 + 0.1;
                    const colors = ['rgba(200, 100, 220, 0.2)', 'rgba(234, 0, 255, 0.15)', 'rgba(180, 80, 200, 0.2)', 'rgba(244, 232, 246, 0.3)'];
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    particlesContainer.appendChild(particle);
                    animateParticle(particle);
                }
            }

            function animateParticle(particle) {
                const duration = Math.random() * 20000 + 10000;
                let startX = parseFloat(particle.style.left);
                let startY = parseFloat(particle.style.top);
                const destX = Math.random() * 100;
                const destY = Math.random() * 100;
                let startTime = null;

                function moveParticle(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const progress = (timestamp - startTime) / duration;
                    if (progress < 1) {
                        particle.style.left = `${startX + (destX - startX) * progress}%`;
                        particle.style.top = `${startY + (destY - startY) * progress}%`;
                        requestAnimationFrame(moveParticle);
                    } else {
                        animateParticle(particle);
                    }
                }
                requestAnimationFrame(moveParticle);
            }

            function showTypingIndicator() {
                const typingIndicator = document.createElement('div');
                typingIndicator.className = 'typing-indicator';
                typingIndicator.id = 'typingIndicator';
                for (let i = 0; i < 3; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'typing-dot';
                    typingIndicator.appendChild(dot);
                }
                chatMessages.appendChild(typingIndicator);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                setTimeout(() => typingIndicator.classList.add('show'), 100);
            }

            function hideTypingIndicator() {
                const indicator = document.getElementById('typingIndicator');
                if (indicator) indicator.remove();
            }

            function addMessage(type, content) {
                hideTypingIndicator();
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                messageDiv.textContent = content;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function saveFlashcardsToStorage(cards) {
                const existing = JSON.parse(localStorage.getItem('flashcards')) || [];
                cards.forEach(card => {
                    existing.push({
                        id: Date.now().toString() + Math.random().toString(36).slice(2),
                        title: card.title,
                        front: card.front,
                        back: card.back,
                        tags: Array.isArray(card.tags) ? card.tags : [],
                        createdAt: new Date().toISOString()
                    });
                });
                localStorage.setItem('flashcards', JSON.stringify(existing));
            }

            async function sendMessage() {
                const message = messageInput.value.trim();
                if (!message || isSending) return;

                isSending = true;
                sendButton.disabled = true;
                messageInput.value = '';

                addMessage('user', message);
                chatHistory.push({ role: 'user', content: message });

                showTypingIndicator();

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: message, history: chatHistory })
                    });

                    const data = await response.json();

                    if (data.error) {
                        addMessage('tutor', 'Sorry, something went wrong. Please try again.');
                    } else if (data.flashcards && data.flashcards.length > 0) {
                        saveFlashcardsToStorage(data.flashcards);
                        addMessage('tutor', `Done! ${data.flashcards.length} flashcards added to your collection.`);
                    } else {
                        addMessage('tutor', data.response);
                        chatHistory.push({ role: 'assistant', content: data.response });
                    }
                } catch (error) {
                    hideTypingIndicator();
                    addMessage('tutor', 'Could not connect to Pi. Make sure the backend server is running.');
                }

                isSending = false;
                sendButton.disabled = false;
                messageInput.focus();
            }

            // Send button click
            sendButton.addEventListener('click', sendMessage);

            // Enter key to send
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Welcome message and start particles
            createParticles();
            addMessage('tutor', "Hi! I'm Pi, your math study assistant. Ask me any math question and I'll help guide you to the answer. I won't give you the answer directly, but I'll help you understand the concepts!");
        });
    </script>
</body>
</html>
